pipeline:
  max_passes: 3
  epsilon: 1.0
  delta: 0.5
  score_accept: 85
  revision_mode: patch

corroboration:
  min_sources: 2

gather:
  max_sources: 10

retrieval:
  top_k_passages: 3

verify:
  max_currency_years: 2.0

writer:
  profile: kevich
  min_words: 1500
  target_words: 2000
  max_words: 2500
  max_instructions_chars: 4000

llm:
  base_url: https://openrouter.ai/api/v1
  models:
    style: google/gemini-3-flash-preview
    gather: openai/gpt-4o-mini
    writer: deepseek/deepseek-v4-pro
    factcheck: openai/gpt-4o-mini
    critic: openai/gpt-4o-mini

web:
  database_url: sqlite:///./factful.db
  auth_mode: mock
  session_secret: dev-secret-change-me
  google_client_id: ""
  google_client_secret: ""

video:
  default_strategy: stock
  width: 1920
  height: 1080
  fps: 30
  voice: en-US-AriaNeural
  tts_rate: -15%
  tts_pitch: -5Hz
  script_director_model: openai/gpt-4o-mini
  ai_provider: kling
  ai_model: kling/kling-1.6
  ai_api_key_env: KLING_API_KEY
  ai_max_clips: 15
  ai_clip_duration_seconds: 5
  stock_provider: pexels
  stock_api_key_env: PEXELS_API_KEY
  stock_min_resolution: 1080p
  hybrid_ai_budget_seconds: 30
  music_enabled: true
  music_volume: 0.15

