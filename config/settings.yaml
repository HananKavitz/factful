pipeline:
  max_passes: 3
  epsilon: 1.0
  delta: 0.5
  score_accept: 85
  revision_mode: patch

corroboration:
  min_sources: 2

gather:
  max_sources: 10

retrieval:
  top_k_passages: 3

verify:
  max_currency_years: 2.0

writer:
  profile: kevich
  min_words: 1500
  target_words: 2000
  max_words: 2500
  max_instructions_chars: 4000

llm:
  base_url: https://openrouter.ai/api/v1
  models:
    style: google/gemini-3-flash-preview
    gather: openai/gpt-4o-mini
    writer: deepseek/deepseek-v4-pro
    factcheck: openai/gpt-4o-mini
    critic: openai/gpt-4o-mini

web:
  database_url: sqlite:///./factful.db
  auth_mode: google
  session_secret: dev-secret-change-me
  google_client_id: ""
  google_client_secret: ""

video:
  fps: 1
  width: 640
  height: 360
  min_slide_seconds: 5.0
  voice: en-US-AriaNeural
  image_relevance_mode: keyword
  max_concurrent_fetches: 3
  # All-AI image generation
  image_source_type: unsplash
  prompt_model: openai/gpt-4o-mini
  image_model: openai/gpt-image-3
  image_api_key: ""
  min_semantic_score: 0.3
  enable_llm_verify: false
  regenerate_on_failure: true
  debug_save_prompts: false
