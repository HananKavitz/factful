[project]
name = "factful"
version = "0.1.0"
description = "Agentic, fact-grounded Substack article generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "authlib>=1.3",
    "edge-tts>=6.1",
    "fastapi>=0.115",
    "ffmpeg-downloader>=0.3",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "moviepy>=2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "PyYAML>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
turso = ["sqlalchemy-libsql>=0.2.0"]

[project.scripts]
factful = "factful.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factful"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/factful"]
strict = true

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["factful"]

[tool.coverage.report]
show_missing = true

[tool.uv]
package = true
